<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Biblioteca de Videojuegos</title>
    <!-- Importamos Bootstrap para no perder tiempo en CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light">

<!-- BARRA DE NAVEGACIÓN -->
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <span class="navbar-brand mb-0 h1">Gestor de Videojuegos</span>
        <button id="btn-logout" class="btn btn-outline-light btn-sm d-none">Cerrar Sesión</button>
    </div>
</nav>

<div class="container">
    <!-- VISTA DE LOGIN (Se oculta si hay token) -->
    <div id="login-view" class="row justify-content-center">
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h4 class="card-title text-center mb-4">Acceso Admin</h4>
                    <form id="login-form">
                        <div class="mb-3">
                            <label class="form-label">Usuario</label>
                            <input type="text" id="username" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Contraseña</label>
                            <input type="password" id="password" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Entrar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- VISTA DEL DASHBOARD (Se muestra si hay token) -->
    <div id="dashboard-view" class="d-none">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>Mi Catálogo</h2>
            <button id="btn-nuevo-juego" class="btn btn-success">Agregar Juego</button>
        </div>

        <div class="table-responsive">
            <table class="table table-striped table-hover bg-white shadow-sm rounded">
                <thead class="table-dark">
                <tr>
                    <th>Título</th>
                    <th>Género</th>
                    <th>Plataforma</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody id="tabla-juegos">
                <!-- Aquí inyectaremos las filas con JS -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- SCRIPTS MODULARES -->
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
